name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verified-release:
    # Release requires reproducible automated checks plus real portable/install
    # smoke tests. UI, performance, signing and hardware diagnostics are useful
    # but are not release blockers for this project.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and required release gates
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw 'Tag and VERSION mismatch.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'aipet-release-evidence'
          ./scripts/collect-release-evidence.ps1 -Gate automated -EvidenceDirectory $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Automated release gate failed.' }
          ./scripts/collect-release-evidence.ps1 -Gate package-smoke -EvidenceDirectory $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Package smoke release gate failed.' }
          ./scripts/verify-release.ps1 -EvidenceDirectory $evidence
      - name: Publish tested assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $notes = "docs/RELEASE_NOTES_$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'Release notes missing.' }
          $portable = "dist/portable/windows-ai-desktop-pet-v$version-portable.zip"
          $installer = "dist/installer/windows-ai-desktop-pet-v$version-setup.exe"
          gh release create "v$version" $portable $installer dist/checksums/SHA256SUMS.txt --title "Windows AI Desktop Pet v$version" --notes-file $notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          $download = Join-Path $env:RUNNER_TEMP ("aipet-verify-" + [Guid]::NewGuid().ToString('N'))
          gh release download "v$version" --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Remote asset download failed.' }
          foreach ($file in @($portable,$installer,'dist/checksums/SHA256SUMS.txt')) {
            $remote = Join-Path $download ([IO.Path]::GetFileName($file))
            if ((Get-FileHash -LiteralPath $file).Hash -ne (Get-FileHash -LiteralPath $remote).Hash) { throw 'Remote asset hash mismatch.' }
          }
